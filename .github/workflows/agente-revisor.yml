name: agente-revisor

# Roda em todo PR para homologacao. Ver 04-workflow-cicd.md §3 estágio 2.
#
# Independente do monorepo de propósito: é Node puro, sem pnpm nem Turborepo,
# então já funciona antes de PV-010. O pipeline de lint/build/test é PV-CI2.

on:
  pull_request:
    branches: [homologacao]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # o agente compara commits contra a base

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Corpo do PR para arquivo
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.md

      - name: Rodar agente revisor
        id: revisor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Flash mantém camada gratuita; Pro exige Cloud Billing desde abr/2026.
          # Para trocar de modelo ou de nível de raciocínio basta criar as
          # variáveis de repositório — nenhuma mudança de código.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'HIGH' }}
        run: |
          set +e
          node ci/agente-revisor.mjs \
            --spec 02-spec.md \
            --claude-md CLAUDE.md \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --pr-body /tmp/pr-body.md \
            > /tmp/relatorio.md 2> /tmp/erro.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/relatorio.md
          [ -s /tmp/erro.log ] && cat /tmp/erro.log
          exit 0

      - name: Comentar no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARCA="<!-- agente-revisor -->"
          printf '%s\n%s\n' "$MARCA" "$(cat /tmp/relatorio.md)" > /tmp/comentario.md
          # atualiza o comentário anterior em vez de empilhar um novo a cada push
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                 --jq "[.[] | select(.body | startswith(\"$MARCA\"))] | last | .id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" \
              -F body=@/tmp/comentario.md >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@/tmp/comentario.md >/dev/null
          fi

      - name: Aplicar veredicto
        run: |
          # exit 1 = violação determinística (segredo, arquivo proibido, commit
          # fora do padrão, risco subdeclarado). Isso barra o merge.
          # A cobertura de Gherkin é consultiva por padrão — ver o cabeçalho do
          # agente-revisor.mjs para a justificativa.
          if [ "${{ steps.revisor.outputs.exit }}" != "0" ]; then
            echo "::error::O agente revisor encontrou violações que bloqueiam o merge. Veja o comentário no PR."
            exit 1
          fi
          echo "Sem violações bloqueantes."
